# version: "3.9"

x-common-env: &common-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: INFO
  ENV: docker
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

services:
  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: docintel-api
    ports:
      - "8010:8000"
    environment:
      <<: *common-env
      CV_SERVICE_URL: http://cv_service:8001
      NLP_SERVICE_URL: http://nlp_service:8002
      RAG_SERVICE_URL: http://rag_service:8003
      SUMMARY_SERVICE_URL: http://summary_service:8005
      PROMPT_SERVICE_URL: http://prompt_service:8006
      JOBS_DIR: /app/data/jobs
    volumes:
      - ./data/jobs:/app/data/jobs
    depends_on:
      cv_service:
        condition: service_started
      nlp_service:
        condition: service_started
      summary_service:
        condition: service_started
      prompt_service:
        condition: service_started
    restart: unless-stopped
    networks:
      - docnet

  cv_service:
    build:
      context: .
      dockerfile: services/cv_service/Dockerfile
    container_name: docintel-cv
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
    volumes:
      - cv_models:/root/.EasyOCR
    restart: unless-stopped
    networks:
      - docnet

  nlp_service:
    build:
      context: .
      dockerfile: services/nlp_service/Dockerfile
    container_name: docintel-nlp
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - docnet

  rag_service:
    build:
      context: .
      dockerfile: services/rag_service/Dockerfile
    container_name: docintel-rag
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - docnet

  summary_service:
    build:
      context: .
      dockerfile: services/summary_service/Dockerfile
    container_name: docintel-summary
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
    restart: unless-stopped
    networks:
      - docnet

  prompt_service:
    build:
      context: .
      dockerfile: services/prompt_service/Dockerfile
    container_name: docintel-prompt
    ports:
      - "8006:8006"
    environment:
      <<: *common-env
    restart: unless-stopped
    networks:
      - docnet

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    container_name: docintel-ui
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
      API_URL: http://api:8000          # ← Inside Docker, use the container name
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - docnet

networks:
  docnet:
    driver: bridge

volumes:
  cv_models:
  hf_cache: