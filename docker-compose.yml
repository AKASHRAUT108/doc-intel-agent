version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: docintel-api
    ports:
      - "8010:8010"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - ENV=docker
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - docnet

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    container_name: docintel-ui
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8010
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - docnet

networks:
  docnet:
    driver: bridge